<style>

:root{--bg:#F2F3F5;--card:#fff;--ink:#0B0B0C;--blue:#0A5BFF;--on-blue:#fff;--muted:#5F6670;--line:#E0E3E8;--mine:#DCE7FF;--zone:#F1F5FF;--czone:#F4F4F5;--hero:#0B0B0C;--hero-ink:#fff;--live:#18A558;--snap:#C98A00;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090A;--card:#151619;--ink:#F3F4F6;--blue:#4C8DFF;--on-blue:#09090A;--muted:#9BA3AE;--line:#2A2D33;--mine:#15244A;--zone:#101828;--czone:#1A1B1E;--hero:#1B1D22;--hero-ink:#fff;--live:#3DDC84;--snap:#F0B429}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#0B0B0C;color:#fff;padding:18px 16px 14px;position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:var(--blue)}
h1{font:800 clamp(30px,8.5vw,46px)/.92 "Barlow Condensed",Impact,sans-serif;margin:0;text-transform:uppercase;letter-spacing:.01em}
.presented{display:flex;align-items:center;gap:10px;font:600 11px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.7);margin-bottom:10px}
.presented span{white-space:nowrap}
.presented a{display:block;line-height:0}
.presented img{height:22px;width:auto}
.vn{margin-left:auto;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:600 12px Barlow,sans-serif;letter-spacing:.02em;text-transform:none;white-space:nowrap}
.vn[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}
.sub{color:rgba(255,255,255,.72);font-weight:500;margin-top:6px;font-size:15px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.wrap,main{max-width:820px;margin:0 auto}
main{padding:4px 16px 48px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.tabs button{border:0;background:none;padding:9px 4px;border-radius:9px;font:700 17px "Barlow Condensed",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--card)}
.row{display:flex;gap:8px}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px}
input,select{flex:1;min-width:0}
button{cursor:pointer;font-weight:600}
:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.status{margin-top:8px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.status button{padding:5px 12px;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px}
.dot.snap{background:var(--snap)}
.section{font:800 22px/1 "Barlow Condensed",sans-serif;color:var(--ink);text-transform:uppercase;letter-spacing:.02em;margin:24px 0 10px;padding-left:10px;border-left:4px solid var(--blue);display:flex;justify-content:space-between;align-items:baseline}
.section small{font:500 13px Barlow,sans-serif;color:var(--muted);text-transform:none;letter-spacing:0}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
tr:last-child td{border-bottom:0}
th{font:700 13px "Barlow Condensed",sans-serif;color:var(--muted);background:var(--card);position:sticky;top:0;text-transform:uppercase;letter-spacing:.04em}
td.t,th.t{text-align:left;position:sticky;left:0;background:inherit;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
td.t{font-weight:700}
tbody tr{background:var(--card)}
tbody tr.q{background:var(--zone)}
tbody tr.c{background:var(--czone)}
tbody tr.me{background:var(--mine);box-shadow:inset 4px 0 0 var(--blue)}
tr.cut td{border-bottom:3px solid var(--blue)}
tr.ccut td{border-bottom:3px dashed var(--muted)}
td.pts{font:800 19px "Barlow Condensed",sans-serif;color:var(--blue)}
td.rk{font:800 18px "Barlow Condensed",sans-serif;color:var(--muted);width:28px}
.pos{color:var(--blue);font-weight:600}.neg{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:10px 2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:18px;margin-top:14px;border:1px solid var(--line);box-shadow:inset 0 4px 0 var(--blue)}
.hero h2{font:800 32px/1 "Barlow Condensed",sans-serif;margin:0 0 6px;text-transform:uppercase}
.hero .zone{font-weight:600;color:rgba(255,255,255,.72);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 4px;text-align:center}
.stat b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif}
.stat:nth-child(2) b{color:#6FA3FF}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h3{font:700 14px "Barlow Condensed",sans-serif;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.05em}
.panel .big{font:700 21px/1.15 "Barlow Condensed",sans-serif}
.panel p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.game{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px 12px 12px 6px;padding:10px 14px;margin:8px 0}
.game.mine{border-left-color:var(--blue);background:var(--mine)}
.game.next{border-left-color:var(--ink)}
.gtop{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-bottom:4px}
.gtop b{color:var(--ink)}
.teams{display:grid;grid-template-columns:1fr auto;gap:1px 12px;font:700 20px/1.2 "Barlow Condensed",sans-serif}
.teams .w{color:var(--blue)} .teams .l{opacity:.55}
.score{text-align:right;font-variant-numeric:tabular-nums}
.proj{font:500 13px Barlow,sans-serif;color:var(--muted)}
.tag{display:inline-block;font:700 11px Barlow,sans-serif;padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--card);margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
.res{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:0 6px;font:700 14px Barlow,sans-serif;color:#fff;margin-right:6px}
.res.W{background:var(--blue);color:var(--on-blue)}.res.L{background:var(--ink);color:var(--card)}.res.T{background:var(--muted)}
.empty{padding:28px 4px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.chips button{white-space:nowrap;padding:6px 12px;font-size:14px;border-radius:999px}

.tlink{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline dotted var(--muted);text-underline-offset:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis}

</style>
</head>

const PLACES=["First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth","Eleventh","Twelth","Twelfth"];

function placeTeam(label){const m=String(label).match(/^(\w+) Place$/i); if(!m) return null;
  const i=PLACES.findIndex(p=>p.toLowerCase()===m[1].toLowerCase()); const n=i>11?12:i+1;
  const s=D.standings.find(x=>x.rank===n); return s?s.team:null;}
function zone(r){return r<=8?"q":r<=12?"c":""}

function parseCSV(t){const out=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true; else if(c==','){row.push(f);f=""}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);out.push(row);row=[];f=""}
    else f+=c}
  if(f!==""||row.length){row.push(f);out.push(row)}
  return out.map(r=>r.map(s=>s.trim()));}
function fromCSV(text){
  const g=parseCSV(text), st=[], gm=[]; let mode=null, idx=null;
  for(const r of g){const ne=r.filter(Boolean); if(!ne.length) continue;
    if(ne[0]==="#"&&ne[1]==="Team"){mode="s";continue}
    if(ne[0]==="Schedule"){mode=null;continue}
    if(ne[0]==="Ga"&&r.includes("Home")){mode="g";const f=n=>r.indexOf(n);
      idx={id:f("Ga"),date:f("Date"),time:f("Start"),arena:f("Arena"),type:f("Type"),home:f("Home"),hs:f("H"),away:f("Visitor"),vs:f("V")};continue}
    if(mode==="s"&&ne.length>=10&&isNum(ne[0]))st.push({rank:+ne[0],team:ne[1],G:+ne[2],W:+ne[3],L:+ne[4],T:+ne[5],GF:+ne[6],GA:+ne[7],PTS:+ne[8],pct:ne[9]});
    if(mode==="g"&&idx){const o={};for(const k in idx)o[k]=idx[k]>=0?(r[idx[k]]||""):"";if(o.home||o.away)gm.push(o)}}
  if(st.length<4||gm.length<4) throw new Error("sheet layout changed");
  return {standings:st,games:gm};}

  let proj="";
  if(s.rank<=12){const pg=D.games.find(g=>!isRR(g)&&[g.home,g.away].some(l=>placeTeam(l)===team));
    if(pg){const opp=placeTeam(pg.home)===team?pg.away:pg.home;proj=`<div class="panel" style="margin-top:10px"><h3>If it ended now</h3><div class="big">${esc(pg.type)} vs ${esc(placeTeam(opp)||opp)}</div><p>Sun ${esc(pg.time)} · ${esc(pg.arena)}</p></div>`}}
  return `<div class="hero"><h2>${esc(team)}</h2><div class="zone">${s.rank}${["th","st","nd","rd"][(s.rank%100>10&&s.rank%100<14)?0:Math.min(s.rank%10,4)%4]||"th"} of ${D.standings.length} · ${zoneText(s.rank)}${gap}</div>
    <div class="stats"><div class="stat"><b>${s.W}-${s.L}-${s.T}</b><span>W-L-T</span></div><div class="stat"><b>${s.PTS}</b><span>Points</span></div>
    <div class="stat"><b>${d>0?"+":""}${d}</b><span>${s.GF} GF · ${s.GA} GA</span></div><div class="stat"><b>${gamesLeft}</b><span>RR left</span></div></div></div>
   <div class="pair">
    <div class="panel"><h3>Next game</h3>${next?`<div class="big">vs ${esc(next.home===team?next.away:next.home)}</div><p>${esc(next.date.slice(0,3))} ${esc(next.time)} · ${esc(next.arena)} · ${next.home===team?"Home":"Away"}</p>`:`<div class="big">Round robin complete</div>`}</div>
    <div class="panel"><h3>Last result</h3>${played.length?(()=>{const x=res(played[played.length-1]);return `<div class="big"><span class="res ${x.r}">${x.r}</span>${x.us}-${x.them}</div><p>vs ${esc(x.opp)}</p>`})():`<div class="big">No results yet</div>`}</div>
   </div>${proj}
   <div class="section">${esc(team)} games</div>${mine.map(g=>gameCard(g,team,next&&next.id)).join("")}`;}

function renderSchedule(q,team){
  const days=[...new Set(D.games.map(g=>g.date))];
  let list=D.games.filter(g=>(!dayF||g.date===dayF)&&(!q||[g.home,g.away,g.arena,g.type,placeTeam(g.home),placeTeam(g.away)].join(" ").toLowerCase().includes(q)));
  const chips=`<div class="chips">${["",...days].map(d=>`<button data-day="${esc(d)}" aria-pressed="${d===dayF}">${d?esc(d.slice(0,10)):"All days"}</button>`).join("")}</div>`;
  if(!list.length) return chips+`<div class="empty">No games match. Clear the search or pick All days.</div>`;
  const now=new Date(), next=D.games.find(g=>!done(g)&&(!when(g)||when(g)>now-90*60000));
  let html=chips, cur=null;
  for(const g of list){ if(g.date!==cur){cur=g.date;const n=list.filter(x=>x.date===cur);html+=`<div class="section">${esc(cur.slice(0,10))}<small>${n.filter(done).length}/${n.length} final</small></div>`}
    html+=gameCard(g,team,next&&next.id)}
  return html;}

function render(){
  const q=$("q").value.trim().toLowerCase(), team=$("team").value;
  $("q").style.display=tab==="team"?"none":"";
  $("out").innerHTML=tab==="team"?renderTeam(team):tab==="standings"?renderStandings(q,team):renderSchedule(q,team);
  $("out").querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>showTeam(b.dataset.goto));
  $("out").querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{dayF=b.dataset.day;render()});}
function fillTeams(){const sel=$("team"),keep=sel.value||store.get("team")||DEFAULT_TEAM;
  const names=D.standings.map(s=>s.team).sort();
  sel.innerHTML=names.map(t=>`<option${t===keep?" selected":""}>${esc(t)}</option>`).join("");}
function setStatus(){$("dot").className="dot"+(live?"":" snap");
  $("upd").textContent=live?"Live · updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):SNAP_LABEL+(PROXY?" · live feed not reachable":"");}

async function load(){
  const src=PROXY||SHEET;
  try{const r=await fetch(src+(src.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0; D=fromCSV(await r.text()); live=true;}
  catch(e){ /* keep last good data */ }
  fillTeams(); setStatus(); render();}

function setTab(t){tab=t;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t))}
function showTeam(t){if(tab==="team"&&$("team").value===t)return;history.replaceState({tab,team:$("team").value,y:scrollY},"");
  $("team").value=t;setTab("team");render();scrollTo(0,0);history.pushState({tab:"team",team:t},"");}
addEventListener("popstate",e=>{const st=e.state;if(!st)return;if(st.team)$("team").value=st.team;setTab(st.tab);render();scrollTo(0,st.y||0)});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{setTab(b.dataset.tab);render()});
$("q").oninput=render;
$("team").onchange=()=>{store.set("team",$("team").value);render()};
$("refresh").onclick=load;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
// voice note: try to autoplay; browsers that block it play on the first tap instead
const vnA=$("vnA"),vnB=$("vn");
const vnUI=()=>{const on=!vnA.paused;vnB.textContent=on?"■ Stop":"▶ Tilt message";vnB.setAttribute("aria-pressed",on)};
vnA.onplay=()=>{vnA.dataset.played=1;vnUI()};vnA.onpause=vnA.onended=vnUI;
vnB.onclick=()=>{if(vnA.paused){vnA.currentTime=0;vnA.play().catch(()=>{})}else vnA.pause()};
const vnEv=["click","touchend","keydown"];
function vnFirst(e){vnEv.forEach(t=>removeEventListener(t,vnFirst,true));if(!vnA.dataset.played&&!e.target.closest("#vn"))vnA.play().catch(()=>{})}
vnA.play().catch(()=>vnEv.forEach(t=>addEventListener(t,vnFirst,true)));
fillTeams(); setStatus(); render(); load(); setInterval(load,60000);
</script>
</body>
</html>
